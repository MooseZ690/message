{% extends "layout.html" %} <!-- borrows formatting, navbar etc from layout file -->

{% block body %}
{% set replyid = request.path[9:] | int%}

<div class="centered-content">
    <h1>New post</h1>
    <div class="block"></div>
    {% for item in results if item[5] == replyid %}
    <div class="reply-to-content">
        <div class="post-container">
            <div class="newpost-text">
                <h1>{{ item[0] }}</h1>
                <h3>@{{ item[2] }}</h3>
                <h2>{{ item[1] }}</h2>
            </div>

            {% if item[3] %}
            <div class="post-img">
                <img src="{{ item[3] }}" alt="{{ item[0] }}">
            </div>
            {% endif %}
        </div>
    </div>
    <!-- if the newpost is a reply, show the post being replied to -->
    {% endfor %}
    <div class="block"></div>
    <form method="post" class="post-container"> <!-- tells app.py the method="POST" -->
        <div class="top-box" style="justify-content: center; align-items: center;">
            <a class="post-meta">
                <img class="profile-image" src="{{user[0][0]}}" alt="profile picture">
                <h2>&nbsp;@{{user[0][1]}}</h2>
            </a>
            <button type="submit" class="post-button-right">
                Post
            </button>
        </div>
        <div class="top-box">
            <input type="text" id="title" name="title" class="top-input-box" placeholder="Title" maxlength="20"
                required>

            <input type="text" id="imageurl" name="imageurl" class="top-input-box" placeholder="Image">
        </div>

        <textarea id="content" name="content" rows="5" class="input-box" placeholder="Ask anything" maxlength="1000"
            required></textarea>

        <select name="categoryid" id="categoryid" class="category-dropdown" required>
            <option value="">Category</option>
            {% for id, name in categories %}
            <option class="cat-drop-content" value="{{ id }}">{{ name }}</option>
            {% endfor %}
        </select>
    </form>
</div>
{% endblock %}
